name: CI - Zed Extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        target:
          - wasm32-wasip1
        os:
          - windows-latest
          - ubuntu-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-component
        run: cargo install cargo-component

      - name: Build Zed extension (wasm component)
        run: |
          cd contrib/zed-extension
          cargo component build --release --target ${{ matrix.target }}

      - name: Package Zed extension
        shell: bash
        run: |
          mkdir -p dist
          cp contrib/zed-extension/target/${{ matrix.target }}/release/kotlin_lsp_zed.wasm dist/extension.wasm
          cp contrib/zed-extension/extension.toml dist/

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: tar -czf zed-extension-${{ matrix.os }}.tar.gz -C dist .

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath zed-extension-${{ matrix.os }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: zed-extension-${{ matrix.os }}
          path: |
            zed-extension-${{ matrix.os }}.tar.gz
            zed-extension-${{ matrix.os }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
